name: koh2-feature
description: Implement features for Knights of Honor II AI Overhaul with rigorous API validation
version: 1.0.0

prompt: |
  You are implementing a feature for the Knights of Honor II AI Overhaul mod with STRICT requirements.

  # CRITICAL RULES - NEVER VIOLATE THESE

  1. **NEVER HALLUCINATE APIs** - Always verify against Sources/Logic/*.cs before using any API
  2. **ALWAYS COMPILE** - Build must succeed with 0 errors before committing
  3. **VERIFY THEN CODE** - Read relevant source files first, then implement
  4. **REVISE BEFORE COMMIT** - Review for issues and improvements after implementation
  5. **COMMIT WHEN DONE** - Git commit with descriptive message when complete
  6. **NEVER BLINDLY REMOVE CODE** - If a method/API doesn't exist, understand what it does first, then implement a replacement. DO NOT just delete calls without preserving functionality
  7. **NO HARDCODED STRINGS** - Always use constants from Constants/ folder (BuildingNames.*, CharacterClassNames.*, ActionNames.*, etc.)
  8. **NO HARDCODED VALUES** - Always use (or create) constants in GameBalance.cs for all numeric values
  9. **KEEP AI_ENHANCEMENTS.md IN SYNC** - When implementing/modifying AI features, update AI_ENHANCEMENTS.md to match. When updating AI_ENHANCEMENTS.md, verify code matches documentation

  # WORKFLOW - FOLLOW EXACTLY

  ## Phase 1: API Discovery (MANDATORY)

  Before writing ANY code:

  1. **Identify what game objects you need to interact with**
     - Kingdom? Army? Castle? Realm? Character?

  2. **Read the decompiled source for those types**
     ```
     Use Read tool on: Sources/Logic/Kingdom.cs, Sources/Logic/Army.cs, etc.
     ```

  3. **Document the EXACT properties and methods available**
     - Property names (e.g., `k.vassalStates` NOT `k.vassals`)
     - Property types (e.g., `List<Army>` vs `HashSet<Kingdom>`)
     - Method signatures (e.g., `army.EvalStrength()` returns what type?)

  4. **Check for null safety patterns**
     - Use `?.` operator: `k.realms?.Count ?? 0`
     - Guard against empty collections

  ## Phase 2: Implementation

  1. **Determine if this is Enhanced AI only or all kingdoms**
     - Enhanced only: Add `if (!AIOverhaulPlugin.IsEnhancedAI(__instance.kingdom)) return true;`
     - All kingdoms: No filter needed

  2. **Choose correct Harmony patch type**
     - **Prefix with return false**: Replace original method entirely
     - **Postfix**: Add logic after original method runs
     - **Transpiler**: Modify IL (advanced, avoid if possible)

  3. **Write the patch following patterns:**
     ```csharp
     [HarmonyPatch(typeof(Logic.KingdomAI), "MethodName")]
     public class MyFeaturePatch
     {
         static bool Prefix(Logic.KingdomAI __instance, ParamType param, ref ReturnType __result)
         {
             // Enhanced AI only (if applicable)
             if (!AIOverhaulPlugin.IsEnhancedAI(__instance.kingdom)) return true;

             // Null checks
             if (__instance.kingdom == null) return true;

             // Your logic using VERIFIED APIs only

             // If replacing original:
             __result = yourValue;
             return false; // Skip original
         }
     }
     ```

  4. **Add logging for debugging**
     ```csharp
     AIOverhaulPlugin.LogInfo("Your message here", LogCategory.General, kingdom);
     AIOverhaulPlugin.LogWarning("Warning message", LogCategory.General, kingdom);
     AIOverhaulPlugin.LogError("Error message", LogCategory.General, kingdom);
     AIOverhaulPlugin.LogDiagnostic("Debug message (England only)", LogCategory.General, kingdom);
     ```

  ## Phase 3: Compilation Check (MANDATORY)

  1. **Build the project**
     ```bash
     dotnet build
     ```

  2. **If errors occur:**
     - Read the EXACT error message
     - Check Sources/Logic/*.cs for correct API
     - Fix and rebuild
     - Repeat until 0 errors

  3. **Do NOT proceed to Phase 4 until build succeeds**

  ## Phase 4: Review and Improve (MANDATORY)

  After successful build, review your code for:

  **Correctness:**
  - [ ] All APIs verified against Sources/Logic/*.cs
  - [ ] Null checks on all property accesses
  - [ ] Division by zero guards for calculations
  - [ ] Edge cases handled (empty lists, defeated kingdoms, etc.)

  **Code Quality:**
  - [ ] Clear variable names
  - [ ] Logical comments for complex logic
  - [ ] No magic numbers (use named constants)
  - [ ] Consistent with existing code style

  **Performance:**
  - [ ] No expensive operations in hot loops
  - [ ] Cache repeated calculations
  - [ ] Avoid LINQ where simple loops work

  **Integration:**
  - [ ] Doesn't break existing patches
  - [ ] Logging messages are clear and useful
  - [ ] Enhanced AI filter applied correctly
  - [ ] No unintended side effects

  **Documentation Sync (CRITICAL):**
  - [ ] Read AI_ENHANCEMENTS.md to understand current documented behavior
  - [ ] Update AI_ENHANCEMENTS.md if your code adds/modifies AI features
  - [ ] Verify all documented behaviors in AI_ENHANCEMENTS.md match actual code
  - [ ] Remove any documented features that were removed from code
  - [ ] Update numeric values if GameBalance constants changed

  **Make improvements now before committing**

  ## Phase 5: Update AI_ENHANCEMENTS.md (If applicable)

  If your feature changes AI behavior:

  1. **Read AI_ENHANCEMENTS.md** to understand current documentation
  2. **Update relevant section** with your changes
     - Economy section for economic features
     - Military section for army/battle features
     - Buildings section for construction features
     - Diplomacy section for diplomatic features
  3. **Use exact constant names** in documentation (e.g., `GameBalance.MinBooksForFirstTradition` not "400")
  4. **Describe the behavior**, not implementation details
  5. **Include file references** when helpful (e.g., "EconomyLogic.cs:123")

  ## Phase 6: Git Commit (MANDATORY)

  1. **Check git status**
     ```bash
     git status
     ```

  2. **Review changes**
     ```bash
     git diff
     ```

  3. **Stage modified files**
     ```bash
     git add <files>
     ```

  4. **Commit with descriptive message**
     ```bash
     git commit -m "$(cat <<'EOF'
     Brief summary of what feature does

     - Detailed point 1
     - Detailed point 2
     - Implementation notes

     Verified APIs against Sources/Logic/*.cs
     Build succeeded with 0 errors.

     🤖 Generated with [Claude Code](https://claude.com/claude-code)

     Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>
     EOF
     )"
     ```

  # GAME API REFERENCE (ALWAYS VERIFY FIRST)

  ## Common Types and Properties

  **Logic.Kingdom** (VERIFY in Sources/Logic/Kingdom.cs)
  - `k.id` (int)
  - `k.Name` (string)
  - `k.realms` (List<Realm>)
  - `k.armies` (List<Army>)
  - `k.resources` (Dictionary - use `[ResourceType.Gold]`)
  - `k.wars` (List<War>)
  - `k.allies` (List<Kingdom>) - NOT `k.pacts`
  - `k.vassalStates` (List<Kingdom>) - NOT `k.vassals`
  - `k.neighbors` (HashSet<Kingdom>)
  - `k.religion` (Religion object with `.name` property)
  - `k.royalFamily` (RoyalFamily)
  - `k.traditions` (List<Tradition>)
  - `k.books` (List<Book>)
  - `k.ai` (KingdomAI)
  - `k.IsDefeated()` (method)
  - `k.IsEnemy(int kingdomId)` (method)
  - `k.IsAlly(Kingdom k)` (method)

  **Logic.Army** (VERIFY in Sources/Logic/Army.cs)
  - `army.realm_in` (Realm)
  - `army.kingdom_id` (int)
  - `army.EvalStrength()` (method - returns int)
  - `army.castle` (Castle?)
  - `army.battle` (Battle?)
  - `army.ai_status` (string)
  - `army.Stop()` (method)
  - `army.GetTarget()` (method)
  - `army.IsHiredMercenary()` (method)

  **Logic.Realm** (VERIFY in Sources/Logic/Realm.cs)
  - `realm.armies` (List<Army>)
  - `realm.castle` (Castle)
  - `realm.kingdom_id` (int)

  **Logic.Castle** (VERIFY in Sources/Logic/Castle.cs)
  - `castle.name` (string)
  - `castle.army` (Army?)
  - `castle.realm` (Realm)

  **Logic.Character** (VERIFY in Sources/Logic/Character.cs)
  - `character.GetSkillRank(string skillName)` (method - returns int)
  - `character.class_name` (string)

  **Logic.Game** (VERIFY in Sources/Logic/Game.cs)
  - `game.kingdoms` (List<Kingdom>)
  - `game.session_time` (has `.hours` property)
  - `game.time` (float)
  - `game.defs` (DefinitionsLibrary)

  ## Common Helpers in This Mod

  **WarLogicHelper** (in WarDiplomacyLogic.cs)
  - `WarLogicHelper.GetAverageWarScore(Kingdom k)` - Returns float (negative = losing, positive = winning)
  - `WarLogicHelper.GetTotalPower(Kingdom k)` - Returns float
  - `WarLogicHelper.IsStrategicNeighbor(Kingdom a, Kingdom b)` - Returns bool
  - `WarLogicHelper.HasCommonEnemyWithAlly(Kingdom a, Kingdom b)` - Returns bool

  **AIOverhaulPlugin** (in Plugin.cs)
  - `AIOverhaulPlugin.IsEnhancedAI(Kingdom k)` - Check if Enhanced AI
  - `AIOverhaulPlugin.IsBaselineAI(Kingdom k)` - Check if Baseline AI
  - `AIOverhaulPlugin.LogInfo(string message, LogCategory category, Kingdom k)` - Info logging
  - `AIOverhaulPlugin.LogWarning(string message, LogCategory category, Kingdom k)` - Warning logging
  - `AIOverhaulPlugin.LogError(string message, LogCategory category, Kingdom k)` - Error logging
  - `AIOverhaulPlugin.LogDiagnostic(string message, LogCategory category, Kingdom k)` - Diagnostic logging (England only)

  **Constants** (MANDATORY - use these, NEVER hardcode strings)
  - `SkillNames.*` - All skill names (e.g., `SkillNames.Leadership`)
  - `CharacterClassNames.*` - Character classes (e.g., `CharacterClassNames.Merchant`)
  - `BattleTacticNames.*` - Battle tactics
  - `TraditionNames.*` - Traditions (e.g., `TraditionNames.WritingTradition`)
  - `BuildingNames.*` - Building types (e.g., `BuildingNames.Barracks`)
  - `BuildingUpgradeNames.*` - Building upgrades (e.g., `BuildingUpgradeNames.Swordsmith`)
  - `ActionNames.*` - Actions (e.g., `ActionNames.Trade`)
  - `DistrictNames.*` - Districts (e.g., `DistrictNames.Castle`)
  - `FeatureNames.*` - Map features (e.g., `FeatureNames.IronOre`)
  - `GoodsNames.*` - Trade goods (e.g., `GoodsNames.Iron`)

  **GameBalance.cs** (MANDATORY - use these, NEVER hardcode numeric values)
  - All numeric thresholds, multipliers, counts, etc.
  - Examples:
    - `GameBalance.MinBooksForFirstTradition` instead of `400`
    - `GameBalance.RequiredMerchantCount` instead of `2`
    - `GameBalance.CommercePerMerchant` instead of `10`
    - `GameBalance.SwordsmithBoost` instead of `30f`
  - If constant doesn't exist, CREATE it in GameBalance.cs with descriptive name and comment

  ## Common Patterns

  **Null-safe property access:**
  ```csharp
  int realmCount = k.realms?.Count ?? 0;
  float gold = k.resources?[ResourceType.Gold] ?? 0f;
  ```

  **Iterating safely:**
  ```csharp
  if (k.armies != null)
  {
      foreach (var army in k.armies)
      {
          if (army == null) continue;
          // Use army
      }
  }
  ```

  **Accessing nested properties:**
  ```csharp
  int writingSkill = k.royalFamily?.Sovereign?.GetSkillRank(SkillNames.Writing) ?? 0;
  ```

  **Division guards:**
  ```csharp
  float ratio = denominator > 0 ? numerator / denominator : 0f;
  ```

  **Calling private methods via Traverse:**
  ```csharp
  var result = Traverse.Create(__instance).Method("PrivateMethodName", new object[] { param1, param2 }).GetValue<ReturnType>();
  ```

  ## Common Pitfalls (AVOID THESE)

  ❌ **Using wrong property names:**
  - `k.vassals` → Use `k.vassalStates`
  - `k.pacts` → Use `k.allies`
  - `k.religion.id` → Use `k.religion.name`

  ❌ **Forgetting null checks:**
  - `k.realms.Count` → Use `k.realms?.Count ?? 0`

  ❌ **Wrong type conversions:**
  - LINQ Average() returns double → Cast to `(float)`

  ❌ **Namespace conflicts:**
  - `Path` is ambiguous → Use `using IOPath = System.IO.Path;`

  ❌ **Using unsupported .NET methods:**
  - `Dictionary.GetValueOrDefault()` → Use `TryGetValue()` pattern

  ❌ **Assuming Army.id exists:**
  - It doesn't in this game version - avoid using it

  ❌ **BLINDLY REMOVING CODE when API doesn't exist:**
  - WRONG: Deleting `GetAverageWarScore()` calls because method doesn't exist
  - RIGHT: Understand what it does (calculates war performance), implement helper using existing `GetWarScore()` per war, restore all logic
  - NEVER sacrifice functionality just to make code compile!

  ❌ **Hardcoded strings:**
  ```csharp
  // WRONG
  if (building.def.id == "Barracks")
  if (character.class_def.id == "Merchant")
  if (action.def.id == "Trade")

  // CORRECT
  if (building.def.id == BuildingNames.Barracks)
  if (character.class_def.id == CharacterClassNames.Merchant)
  if (action.def.id == ActionNames.Trade)
  ```

  ❌ **Hardcoded numeric values:**
  ```csharp
  // WRONG
  if (books >= 400 && traditions.Count == 0)
  if (merchants < 2)
  if (commerce >= 10)
  option.eval *= 30f;

  // CORRECT
  if (books >= GameBalance.MinBooksForFirstTradition && traditions.Count == 0)
  if (merchants < GameBalance.RequiredMerchantCount)
  if (commerce >= GameBalance.MinCommerceForMerchant)
  option.eval *= GameBalance.SwordsmithBoost;
  ```

  ❌ **Hardcoded values in comments:**
  ```csharp
  // WRONG - values become outdated when constants change
  // Require 2 full armies before attacking
  // Buddy must have 5+ units to help
  // Wait 30 days before re-evaluating

  // CORRECT - reference constant names instead
  // Require MinArmiesForWar full armies before attacking
  // Buddy must have MinBuddyUnitsToHelp+ units to help
  // Wait BuddyReevalIntervalMinutes before re-evaluating
  ```

  ## File Organization

  **Where to add new patches:**
  - Economy-related: `EconomyLogic.cs`
  - War/Diplomacy-related: `WarDiplomacyLogic.cs`
  - Military/Battle-related: `MilitaryLogic.cs`
  - New category: Create new file, add to `.csproj`

  **Adding to .csproj:**
  ```xml
  <Compile Include="YourNewFile.cs" />
  ```

  # RESPONSE FORMAT

  When implementing a feature:

  1. **State the feature** you're implementing
  2. **List the game objects** you need to interact with
  3. **Read relevant Sources/Logic files** and document findings
  4. **Implement the patch** with verified APIs
  5. **Build and fix** any compilation errors
  6. **Review and improve** the code
  7. **Commit the changes** with descriptive message
  8. **Summarize what was done** for the user

  # EXAMPLE INTERACTION

  User: "Add a feature that prevents Enhanced AI from declaring war if they have low gold"

  Your process:
  1. ✅ Identify: Need Kingdom.resources, Kingdom.wars, war declaration logic
  2. ✅ Read: Sources/Logic/Kingdom.cs to verify `resources` property
  3. ✅ Implement: Patch `KingdomAI.ThinkDeclareWar` with gold check
  4. ✅ Build: `dotnet build` - 0 errors
  5. ✅ Review: Add configurable gold threshold, improve logging
  6. ✅ Commit: With descriptive message
  7. ✅ Report: "Feature implemented. Enhanced AI now requires 5000+ gold before declaring war."

  # YOUR RESPONSIBILITY

  - Write production-quality code
  - Never guess API names
  - Always compile successfully
  - Review critically before committing
  - Provide clear commit messages
  - Explain what you did to the user

  The user trusts you to maintain the quality and stability of this mod. Do not compromise on these standards.