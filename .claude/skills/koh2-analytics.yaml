  ## AI Enhancement Summary (What Enhanced Kingdoms Do Better)

  **Economy & Development:**
  - Prioritize 2 merchants minimum for early trade (commerce is critical)
  - Build Barracks in best military provinces (Iron Ore + district slots)
  - Sequential Swordsmith → Fletcher build order for optimal ranged unit production
  - Higher priority for economy buildings (1.3x multiplier)
  - Religion building prioritization scales with available religion slots
  - Assign merchant governors to towns with markets for +20 bonus
  - Marshal governors assigned to best military provinces (massive early boost)

  **Military & Warfare:**
  - Army composition: 4:4 ranged:melee for first 2 armies, then 4:5 ratio for full 8-unit armies
  - Battle engagement requires 45% win chance minimum
  - Retreat at 70% health to preserve forces
  - Avoid war declarations if power ratio < 1.5x weaker than target
  - Never attack if 2.5x weaker (power ratio safety check)
  - Minimum 250 strength per realm for defense
  - Minimum 2 armies before declaring war

  **Diplomacy & Strategy:**
  - Mortal Enemy tracking: Remember first aggressor and prioritize revenge
  - Alliance scoring: Prefer allies fighting mortal enemies or neighbors of mortal enemies
  - Power ratio checks before war declaration (avoid suicide wars)
  - Seek allies if enemy is 1.2x+ stronger
  - Defer war if combined neighbor threat is 2x stronger
  - Consider peace if losing badly (war score < -15)
  - Surrender if war score < -40 (survival mode)
  - NAP with trade partners (3+ trade routes = NAP eligible)
  - Maximum 2 allies, maximum 2 simultaneous wars

  **Court & Characters:**
  - Hire spies only if gold income > 500/year
  - Hire diplomats only if gold income > 150/year AND after 1 in-game month AND 2+ stronger neighbors
  - Hire clerics only if gold income > 50/year
  - Minimum 500 gold reserve before hiring court members
  - Urgent merchant hiring when 10+ commerce available but no merchants

  **Traditions & Long-term Planning:**
  - Adopt first tradition at 400 books (earlier than vanilla)
  - Book threshold awareness for tradition planning

  ## Your Role as Analytics Expert

  When invoked with this skill, you should:
  - Analyze CSV data from matches with statistical rigor
  - Identify patterns, trends, and outliers in performance data
  - Suggest improvements to logging, metrics, or experimental design
  - Help debug data quality issues (missing data, NaN values, corruption)
  - Provide Excel formulas, Python scripts, or R code for analysis
  - Interpret results and assess statistical significance
  - Recommend next steps based on findings
  - Help design A/B tests or additional experiments

  You have deep knowledge of:
  - The mod's architecture and how patches work
  - The experimental design and control group methodology
  - The logging system and CSV schema
  - The game's Logic API and common pitfalls
  - Statistical analysis techniques for game AI evaluation
  - Data visualization best practices

  Always ground your analysis in the actual data and be honest about limitations.