name: Run Game Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore AIOverhaul.sln

    - name: Ensure BepInEx Installed
      run: |
        $gamePath = $env:KOH_INSTALL_PATH
        if (-not $gamePath) { Write-Error "KOH_INSTALL_PATH env var not set on runner!"; exit 1 }
        
        if (-not (Test-Path "$gamePath\BepInEx\core\BepInEx.dll")) {
            Write-Host "BepInEx not found. Installing..."
            Expand-Archive -Path "Dependencies\BepInEx.zip" -DestinationPath "$gamePath" -Force
        } else {
            Write-Host "BepInEx already installed."
        }

    - name: Build Mod
      run: msbuild AIOverhaul.sln /p:Configuration=Debug /p:Platform="Any CPU"

    - name: Install Mod
      run: |
        $gamePath = $env:KOH_INSTALL_PATH
        if (-not $gamePath) { Write-Error "KOH_INSTALL_PATH env var not set on runner!"; exit 1 }
        Copy-Item -Path "bin\Debug\AIOverhaul.dll" -Destination "$gamePath\BepInEx\plugins\AIOverhaul.dll" -Force

    - name: Ensure Steam is Running
      run: |
        if (-not (Get-Process steam -ErrorAction SilentlyContinue)) {
            Write-Host "Steam process not found. Attempting to launch..."
            $gamePath = $env:KOH_INSTALL_PATH
            # Try to deduce Steam path from game path (looking for 'steamapps')
            $idx = $gamePath.ToLower().IndexOf("steamapps")
            if ($idx -gt 0) {
                $steamRoot = $gamePath.Substring(0, $idx)
                $steamExe = Join-Path $steamRoot "steam.exe"
                if (Test-Path $steamExe) {
                    Write-Host "Found Steam at $steamExe. Launching..."
                    Start-Process $steamExe
                    Write-Host "Waiting 15 seconds for Steam to initialize..."
                    Start-Sleep -Seconds 15
                } else {
                    Write-Warning "Could not find steam.exe at expected location: $steamExe"
                }
            } else {
                 Write-Warning "Could not deduce Steam path from KOH_INSTALL_PATH"
            }
        } else {
            Write-Host "Steam is already running."
        }

    - name: Run Game Test
      run: |
        $gamePath = $env:KOH_INSTALL_PATH
        Start-Process -FilePath "$gamePath\Sovereign.exe" -ArgumentList "-autoStart", "-kingdom", "Champagne", "-provinces", "2", "-difficulty", "2" -WorkingDirectory "$gamePath" -Wait
      # Uses KOH_INSTALL_PATH environment variable set on the runner.

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: game-logs
        retention-days: 1
        path: |
          AI_Performance_Log.csv
          Player.log
          **/output_log.txt
