name: Build AI Overhaul

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore AIOverhaul.sln

    - name: Build with MSBuild
      run: msbuild AIOverhaul.sln /p:Configuration=Debug /p:Platform="Any CPU"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIOverhaul-dll
        path: bin/Debug/AIOverhaul.dll
        if-no-files-found: error
        retention-days: 1
